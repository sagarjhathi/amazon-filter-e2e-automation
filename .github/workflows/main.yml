name: CI Pipeline

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:
  schedule:
    - cron: "50 17 * * *"   # 11:20 PM IST daily

permissions:
  contents: write   # ✅ allow pushing index.html back to repo

env:
  JAVA_DISTRIBUTION: temurin
  JAVA_VERSION: 24
  WORKDIR: eclipse-workspace/Intro
  ARTIFACT_RETENTION_DAYS: 7

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false   # one shard failing shouldn't cancel the other two
      matrix:
        group: [BatteryProcessorOsStorage, BrandsScreenSizeTypeCamEtc, DeliveryAndPrice]
    env:
      REPORT_BASE: "/amazon-filter-e2e-automation/"
      IS_CRON: ${{ github.event_name == 'schedule' }}  # <-- "true" only for cron
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true   # ✅ ensures GITHUB_TOKEN is kept for pushing

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Cache Maven target and .m2 repo (optional)
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ${{ env.WORKDIR }}/target
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-

      - name: Print environment info
        shell: bash
        run: |
          echo "Java version:"
          java -version
          echo "Maven version:"
          mvn -v
          echo "Working directory: ${{ env.WORKDIR }}"
          echo "Runner OS: $RUNNER_OS"

      - name: Notify Discord – Start of Test
        if: always()
        shell: bash
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          runUrl="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          timestamp=$(TZ='Asia/Kolkata' date +"%Y-%m-%d %I:%M %p IST")
          actor="${{ github.actor }}"
          branch="${{ github.ref_name }}"
          job_name="${{ github.job }}"

          curl -H "Content-Type: application/json" -X POST -d "{\"content\": \"**CI Test Started - $job_name**\\n Triggered by: $actor\\n Branch: $branch\\n Start Time: $timestamp\\n [View Run]($runUrl)\"}" "$DISCORD_WEBHOOK"


      - name: Set RUN_TIMESTAMP (Windows runner)
        id: set_ts
        shell: pwsh
        run: |
          # produce format yyyy-MM-dd_HH-mm-ss (matches local format)
          $ts = Get-Date -Format 'yyyy-MM-dd_HH-mm-ss'
          Write-Host "RUN_TIMESTAMP = $ts"
          # export to GITHUB_ENV for subsequent steps
          Add-Content -Path $env:GITHUB_ENV -Value "RUN_TIMESTAMP=$ts"


      - name: Build project
        run: mvn clean compile
        working-directory: ${{ env.WORKDIR }}


      - name: Run Maven Tests
        working-directory: ${{ env.WORKDIR }}
        run: mvn test -Dgroups=${{ matrix.group }}
        continue-on-error: true
       

      - name: Find latest run folder
        id: find_run
        shell: pwsh
        run: |
          $runFolder = Get-ChildItem -Path "${{ env.WORKDIR }}" -Directory -Filter "run_*" |
                       Sort-Object LastWriteTime -Descending |
                       Select-Object -First 1
      
          echo "RUN_FOLDER=$($runFolder.Name)" >> $env:GITHUB_ENV


      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: extent-${{ matrix.group }}
          path: ${{ env.WORKDIR }}/${{ env.RUN_FOLDER }}
          retention-days: 30


      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.group }}
          path: ${{ env.WORKDIR }}/target/allure-results
          if-no-files-found: warn


  publish:
    needs: test
    if: always()
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Set RUN_TIMESTAMP (Windows runner)
        shell: pwsh
        run: |
          $ts = Get-Date -Format 'yyyy-MM-dd_HH-mm-ss'
          Add-Content -Path $env:GITHUB_ENV -Value "RUN_TIMESTAMP=$ts"

      - name: Download BatteryProcessorOsStorage report
        uses: actions/download-artifact@v4
        with:
          name: extent-BatteryProcessorOsStorage
          path: shards/BatteryProcessorOsStorage

      - name: Download BrandsScreenSizeTypeCamEtc report
        uses: actions/download-artifact@v4
        with:
          name: extent-BrandsScreenSizeTypeCamEtc
          path: shards/BrandsScreenSizeTypeCamEtc

      - name: Download DeliveryAndPrice report
        uses: actions/download-artifact@v4
        with:
          name: extent-DeliveryAndPrice
          path: shards/DeliveryAndPrice

      - name: Download BatteryProcessorOsStorage allure results
        uses: actions/download-artifact@v4
        with:
          name: allure-results-BatteryProcessorOsStorage
          path: allure-results/BatteryProcessorOsStorage

      - name: Download BrandsScreenSizeTypeCamEtc allure results
        uses: actions/download-artifact@v4
        with:
          name: allure-results-BrandsScreenSizeTypeCamEtc
          path: allure-results/BrandsScreenSizeTypeCamEtc

      - name: Download DeliveryAndPrice allure results
        uses: actions/download-artifact@v4
        with:
          name: allure-results-DeliveryAndPrice
          path: allure-results/DeliveryAndPrice

      - name: Set up Node (for Allure CLI)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate merged Allure report
        run: |
          npm install -g allure-commandline
          allure generate allure-results/BatteryProcessorOsStorage allure-results/BrandsScreenSizeTypeCamEtc allure-results/DeliveryAndPrice --clean -o allure-report


      - name: Enable long paths (Windows)
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          clean: false
          ref: gh-pages
          path: gh-pages


      - name: Clean gh-pages
        shell: pwsh
        run: |
          Get-ChildItem -Path gh-pages -Force | Where-Object { $_.Name -ne '.git' } | Remove-Item -Recurse -Force


      - name: Assemble published site
        shell: pwsh
        run: |
          $run = "run_$env:RUN_TIMESTAMP"
          $runPath = "gh-pages/$run"
          New-Item -ItemType Directory -Path $runPath -Force | Out-Null

          # Each shard's reports/logs/screenshots folder is moved as a whole, untouched -
          # its ExtentReport.html uses ../logs and ../screenshots relative links, so the
          # three subfolders inside it must stay exactly as the shard produced them.
          Copy-Item -Recurse -Force "shards/BatteryProcessorOsStorage" "$runPath/BatteryProcessorOsStorage"
          Copy-Item -Recurse -Force "shards/BrandsScreenSizeTypeCamEtc" "$runPath/BrandsScreenSizeTypeCamEtc"
          Copy-Item -Recurse -Force "shards/DeliveryAndPrice" "$runPath/DeliveryAndPrice"
          Copy-Item -Recurse -Force "allure-report" "$runPath/allure-report"

          $indexPath = "gh-pages/index.html"
          Set-Content -Path $indexPath -Value "<h1>Test run: $run</h1>"
          Add-Content -Path $indexPath -Value "<ul>"
          Add-Content -Path $indexPath -Value "<li><a href='$run/allure-report/index.html'>Allure report (all shards, merged)</a></li>"
          Add-Content -Path $indexPath -Value "<li><a href='$run/BatteryProcessorOsStorage/reports/ExtentReport.html'>Extent report - Battery / Processor / OS / Storage / Discount</a></li>"
          Add-Content -Path $indexPath -Value "<li><a href='$run/BrandsScreenSizeTypeCamEtc/reports/ExtentReport.html'>Extent report - Brands / Screen Size / Display Type / Camera</a></li>"
          Add-Content -Path $indexPath -Value "<li><a href='$run/DeliveryAndPrice/reports/ExtentReport.html'>Extent report - Delivery / Price</a></li>"
          Add-Content -Path $indexPath -Value "</ul>"


      - name: Deploy
        shell: pwsh
        working-directory: gh-pages
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          # Reset gh-pages to a single fresh commit each run instead of committing on top
          # of prior history - otherwise every run's report/screenshots pile up forever
          # even though only the latest commit is ever actually served.
          git checkout --orphan gh-pages-deploy
          git add -A
          git commit -m "Update report"
          git push origin gh-pages-deploy:gh-pages --force